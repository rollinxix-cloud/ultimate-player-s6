<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Player S11 | Official Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DARK MODE (Night Match - Default) */
            --bg-base: #02060c;
            --bg-accent: #110821;
            --text-main: #ffffff;
            --ef-blue: #00e5ff;
            --ef-yellow: #f8ff00;
            --ef-card: rgba(15, 25, 45, 0.9);
            --ef-border: rgba(0, 229, 255, 0.15);
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 229, 255, 0.15), transparent 70%);
            --leg-info-bg: rgba(0,0,0,0.3);
            --shadow: rgba(0,0,0,0.4);
            --fb-color: #ffffff;
        }

        body.light-mode {
            /* LIGHT MODE (Day Match - Vibrant) */
            --bg-base: #f0f4f8;
            --bg-accent: #ffffff;
            --text-main: #0a1128;
            --ef-blue: #0056b3;
            --ef-yellow: #d97706;
            --ef-card: rgba(255, 255, 255, 0.95);
            --ef-border: rgba(0, 86, 179, 0.2);
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 86, 179, 0.1), transparent 70%);
            --leg-info-bg: #e2e8f0;
            --shadow: rgba(0,0,0,0.1);
            --fb-color: #0a1128;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                var(--glow),
                linear-gradient(var(--ef-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--ef-border) 1px, transparent 1px),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-accent) 100%);
            background-size: 100% 100%, 60px 60px, 60px 60px, 100% 100%;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: all 0.4s ease;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            background: rgba(0,0,0,0.1);
        }
