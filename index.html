<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Player S11 | Official Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #02060c;
            --bg-accent: #0b1120;
            --text-main: #ffffff;
            --ef-blue: #00e5ff;
            --ef-yellow: #f8ff00;
            --ef-card: linear-gradient(145deg, rgba(15, 25, 45, 0.95), rgba(5, 10, 20, 0.95));
            --ef-border: rgba(0, 229, 255, 0.4);
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 229, 255, 0.15), transparent 70%);
            --shadow: rgba(0,0,0,0.6);
            --score-bg: rgba(0, 0, 0, 0.8);
        }

        body.light-mode {
            --bg-base: #e2e8f0;
            --bg-accent: #ffffff;
            --text-main: #0f172a;
            --ef-blue: #0056b3;
            --ef-yellow: #d97706;
            --ef-card: linear-gradient(145deg, #ffffff, #f8fafc);
            --ef-border: rgba(0, 86, 179, 0.3);
            --shadow: rgba(0,0,0,0.1);
            --score-bg: #e2e8f0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-base);
            background-image: var(--glow), linear-gradient(135deg, var(--bg-base) 0%, var(--bg-accent) 100%);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            transition: all 0.4s ease;
        }

        .top-bar {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .ef-logo {
            width: 65px;
            height: 65px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px var(--ef-blue));
            border-radius: 8px;
        }

        /* Prediction Banner */
        .vote-banner {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--ef-border);
            margin: 10px 20px;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            font-weight: 700;
            color: var(--ef-yellow);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .theme-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--ef-blue);
            color: var(--ef-blue);
            padding: 8px 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        header h1 {
            color: var(--ef-yellow);
            text-align: center;
            font-style: italic;
            letter-spacing: 2px;
            font-size: 1.8rem;
            margin: 10px 0 20px;
        }

        /* BRACKET */
        .viewport-container {
            width: 100%;
            overflow-x: auto;
            display: flex;
            padding-bottom: 80px;
        }

        .bracket {
            display: flex;
            align-items: center;
            gap: 40px;
            padding: 20px 40px;
            min-width: max-content;
        }

        .column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 550px;
        }

        .match {
            background: var(--ef-card);
            border: 1px solid var(--ef-border);
            border-radius: 6px;
            width: 210px;
            position: relative;
            box-shadow: 0 8px 20px var(--shadow);
            overflow: hidden;
        }
        
        .team {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-weight: 700;
        }

        .player-name { cursor: pointer; }
        .player-name:hover { color: var(--ef-yellow); }

        .score { 
            color: var(--ef-blue); 
            background: var(--score-bg);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid var(--ef-border);
        }

        /* VOTING UI IN MODAL */
        .vote-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,229,255,0.2);
        }

        .vote-btn {
            background: var(--ef-blue);
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        .vote-btn.undo {
            background: #ef4444;
            color: white;
            margin-top: 10px;
        }

        .vote-btn:active { transform: scale(0.95); }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            backdrop-filter: blur(4px);
        }
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-accent);
            border: 2px solid var(--ef-blue);
            padding: 30px;
            text-align: center;
            z-index: 2001;
            min-width: 280px;
            border-radius: 8px;
        }
        .modal h2 { color: var(--ef-yellow); margin: 0 0 10px; }

        .fb-float {
            position: fixed; bottom: 20px; right: 20px;
            width: 50px; height: 50px; background: #1877F2;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .fb-float svg { width: 25px; fill: white; }
    </style>
</head>
<body>

<div class="top-bar">
    <img src="YOUR_SQUARE_LOGO_LINK_HERE.png" alt="eFootball" class="ef-logo">
    <button id="themeToggle" class="theme-btn">☀️ Day Match</button>
</div>

<div id="userPrediction" class="vote-banner">
    Pick your Season 11 Winner! Click a player name to vote.
</div>

<header>
    <h1>ULTIMATE PLAYER SEASON 11</h1>
</header>

<div class="viewport-container">
    <div class="bracket">
        <div class="column left-bracket round-1">
            <div class="match">
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Binaya S.')">Binaya S.</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Manees P.')">Manees P.</span> <span class="score">-</span></div>
            </div>
            <div class="match">
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Samir S.')">Samir S.</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Siv S.')">Siv S.</span> <span class="score">-</span></div>
            </div>
        </div>
        <div class="column left-bracket round-2">
            <div class="match">
                <div class="team"><span class="player-name">TBD</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name">TBD</span> <span class="score">-</span></div>
            </div>
        </div>
        <div class="column final-column">
            <div class="match">
                <div class="team"><span class="player-name">TBD</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name">TBD</span> <span class="score">-</span></div>
            </div>
        </div>
        <div class="column right-bracket round-2">
            <div class="match">
                <div class="team"><span class="player-name">TBD</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name">TBD</span> <span class="score">-</span></div>
            </div>
        </div>
        <div class="column right-bracket round-1">
            <div class="match">
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Basanta T.')">Basanta T.</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Manjil C.')">Manjil C.</span> <span class="score">-</span></div>
            </div>
            <div class="match">
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Subash T.')">Subash T.</span> <span class="score">-</span></div>
                <div class="team"><span class="player-name" onclick="openPlayerInfo('Prateek K.')">Prateek K.</span> <span class="score">-</span></div>
            </div>
        </div>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="playerModal" class="modal">
    <h2 id="modalName">Player Name</h2>
    <div id="voteSection" class="vote-section">
        </div>
    <br>
    <button class="close-btn" onclick="closeModal()">Close</button>
</div>

<a href="https://facebook.com/groups/pesmatches" target="_blank" class="fb-float">
    <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
</a>

<script>
    // Initialize Theme
    const btn = document.getElementById('themeToggle');
    btn.onclick = () => {
        document.body.classList.toggle('light-mode');
        btn.innerText = document.body.classList.contains('light-mode') ? '🌙 Night Match' : '☀️ Day Match';
    };

    // VOTE LOGIC
    let currentVotedPlayer = localStorage.getItem('s11_vote') || null;

    function updateBanner() {
        const banner = document.getElementById('userPrediction');
        if (currentVotedPlayer) {
            banner.innerHTML = `Your Winner Prediction: <span style="color:white">${currentVotedPlayer}</span> 🏆`;
        } else {
            banner.innerHTML = "Pick your Season 11 Winner! Click a player name to vote.";
        }
    }

    function openPlayerInfo(name) {
        document.getElementById('modalName').innerText = name;
        const voteSection = document.getElementById('voteSection');
        voteSection.innerHTML = '';

        if (currentVotedPlayer === name) {
            // User already voted for THIS player
            const undoBtn = document.createElement('button');
            undoBtn.className = 'vote-btn undo';
            undoBtn.innerText = 'Undo My Vote';
            undoBtn.onclick = () => removeVote();
            voteSection.appendChild(undoBtn);
        } else {
            // User has not voted for this player
            const voteBtn = document.createElement('button');
            voteBtn.className = 'vote-btn';
            voteBtn.innerText = currentVotedPlayer ? `Change Vote to ${name}` : `Vote for ${name} to Win`;
            voteBtn.onclick = () => castVote(name);
            voteSection.appendChild(voteBtn);
        }

        document.getElementById('playerModal').style.display = 'block';
        document.getElementById('modalOverlay').style.display = 'block';
    }

    function castVote(name) {
        localStorage.setItem('s11_vote', name);
        currentVotedPlayer = name;
        updateBanner();
        closeModal();
        alert(`Prediction Locked: ${name} for the Title!`);
    }

    function removeVote() {
        localStorage.removeItem('s11_vote');
        currentVotedPlayer = null;
        updateBanner();
        closeModal();
    }

    function closeModal() {
        document.getElementById('playerModal').style.display = 'none';
        document.getElementById('modalOverlay').style.display = 'none';
    }

    // Load initial banner state
    updateBanner();
</script>

</body>
</html>
