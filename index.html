<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Player S11 | eFootball Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DARK MODE - Night Match */
            --bg-base: #02060c;
            --bg-accent: #110821;
            --text-main: #ffffff;
            --ef-blue: #00e5ff;
            --ef-yellow: #f8ff00;
            --ef-card: rgba(15, 25, 45, 0.9);
            --ef-border: rgba(0, 229, 255, 0.2);
            --line-opacity: 0.15;
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 229, 255, 0.15), transparent 70%);
            --fb-blue: #1877F2;
        }

        body.light-mode {
            /* LIGHT MODE - Day Match */
            --bg-base: #f0f4f8;
            --bg-accent: #ffffff;
            --text-main: #0a1128;
            --ef-blue: #0056b3;
            --ef-yellow: #d97706;
            --ef-card: rgba(255, 255, 255, 0.95);
            --ef-border: rgba(0, 86, 179, 0.2);
            --line-opacity: 0.1;
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 86, 179, 0.1), transparent 70%);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                var(--glow),
                linear-gradient(var(--ef-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--ef-border) 1px, transparent 1px),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-accent) 100%);
            background-size: 100% 100%, 60px 60px, 60px 60px, 100% 100%;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: all 0.4s ease;
        }

        /* Top Bar */
        .top-bar { width: 100%; max-width: 1000px; display: flex; justify-content: flex-end; padding: 20px; box-sizing: border-box;}
        .theme-btn {
            background: var(--ef-card);
            border: 1px solid var(--ef-blue);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 0 15px var(--ef-border);
        }

        header h1 {
            color: var(--ef-yellow);
            font-style: italic;
            font-size: 2.5rem;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(248, 255, 0, 0.3);
            margin: 0;
            text-align: center;
        }

        /* Bracket Styling */
        .viewport-container { width: 100%; overflow-x: auto; padding-bottom: 80px; display: flex; justify-content: center; }
        .bracket { display: flex; align-items: center; gap: 60px; width: max-content; padding: 40px; }
        
        .column { display: flex; flex-direction: column; justify-content: space-around; height: 650px; }
        .round-name {
            color: var(--ef-blue);
            text-align: center;
            background: rgba(0, 229, 255, 0.1);
            padding: 8px;
            border-left: 4px solid var(--ef-blue);
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .match {
            background: var(--ef-card);
            border: 1px solid var(--ef-border);
            width: 240px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            position: relative;
        }

        .team {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            border-bottom: 1px solid var(--ef-border);
        }

        .score { color: var(--ef-blue); font-size: 1.3rem; }
        .leg-info { font-size: 0.7rem; padding: 8px; text-align: center; background: rgba(0,0,0,0.2); display: block; }

        /* Floating Community Section */
        .community-corner {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .join-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--ef-blue);
            letter-spacing: 1px;
            background: var(--ef-card);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid var(--ef-border);
        }

        .fb-btn {
            background: var(--fb-blue);
            color: white;
            text-decoration: none;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 20px rgba(24, 119, 242, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: pulse-glow 2s infinite;
        }

        .fb-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.6);
        }

        .fb-icon {
            width: 20px;
            height: 20px;
            fill: white;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(24, 119, 242, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(24, 119, 242, 0); }
            100% { box-shadow: 0 0 0 0 rgba(24, 119, 242, 0); }
        }

        @media screen and (max-width: 768px) {
            .bracket { transform: scale(0.8); transform-origin: top left; }
            header h1 { font-size: 1.8rem; }
            .fb-btn { padding: 10px 18px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <button id="themeToggle" class="theme-btn">☀️ Day Match</button>
</div>

<header>
    <h1>ULTIMATE PLAYER SEASON 11</h1>
</header>

<div class="viewport-container">
    <div class="bracket">
        <div class="column">
            <div class="round-name">Quarter-Finals</div>
            <div class="match">
                <div class="team"><span>Binaya Shrestha</span> <span class="score">-</span></div>
                <div class="team"><span>Manees Paudel</span> <span class="score">-</span></div>
                <span class="leg-info">Waiting for Kickoff</span>
            </div>
            <div class="match">
                <div class="team"><span>Samir Sunar</span> <span class="score">-</span></div>
                <div class="team"><span>Siv Sunar</span> <span class="score">-</span></div>
                <span class="leg-info">Waiting for Kickoff</span>
            </div>
            <div class="match">
                <div class="team"><span>Basanta Tamang</span> <span class="score">-</span></div>
                <div class="team"><span>Player F</span> <span class="score">-</span></div>
                <span class="leg-info">Waiting for Kickoff</span>
            </div>
        </div>

        <div class="column">
            <div class="round-name">Semi-Finals</div>
            <div class="match">
                <div class="team"><span>TBD</span> <span class="score">-</span></div>
                <div class="team"><span>TBD</span> <span class="score">-</span></div>
                <span class="leg-info">Pending Results</span>
            </div>
        </div>

        <div class="column column-final">
            <div class="round-name">Grand Final</div>
            <div class="match" style="border: 2px solid var(--ef-yellow);">
                <div class="team" style="color: var(--ef-yellow);"><span>TBD</span> <span class="score">-</span></div>
                <div class="team"><span>TBD</span> <span class="score">-</span></div>
                <span class="leg-info">Championship Match</span>
            </div>
        </div>
    </div>
</div>

<div class="community-corner">
    <span class="join-label">Official Group</span>
    <a href="https://facebook.com/groups/pesmatches" target="_blank" class="fb-btn">
        <svg class="fb-icon" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        PES MATCHES
    </a>
</div>

<script>
    const btn = document.getElementById('themeToggle');
    btn.onclick = () => {
        document.body.classList.toggle('light-mode');
        btn.innerText = document.body.classList.contains('light-mode') ? '🌙 Night Match' : '☀️ Day Match';
    };
</script>
</body>
</html>
