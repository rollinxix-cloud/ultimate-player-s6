<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Player S11 | Official Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #02060c;
            --bg-accent: #110821;
            --text-main: #ffffff;
            --ef-blue: #00e5ff;
            --ef-yellow: #f8ff00;
            --ef-card: rgba(15, 25, 45, 0.9);
            --ef-border: rgba(0, 229, 255, 0.2);
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 229, 255, 0.15), transparent 70%);
        }

        body.light-mode {
            --bg-base: #f0f4f8;
            --bg-accent: #ffffff;
            --text-main: #0a1128;
            --ef-blue: #0056b3;
            --ef-yellow: #d97706;
            --ef-card: rgba(255, 255, 255, 0.95);
            --ef-border: rgba(0, 86, 179, 0.2);
            --glow: radial-gradient(circle at 50% -20%, rgba(0, 86, 179, 0.1), transparent 70%);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-base);
            background-image: var(--glow), 
                linear-gradient(var(--ef-border) 1px, transparent 1px),
                linear-gradient(90deg, var(--ef-border) 1px, transparent 1px),
                linear-gradient(135deg, var(--bg-base) 0%, var(--bg-accent) 100%);
            background-size: 100% 100%, 60px 60px, 60px 60px, 100% 100%;
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            transition: all 0.4s ease;
        }

        /* Top Navigation */
        .nav-header {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .ef-logo { width: 120px; filter: drop-shadow(0 0 10px var(--ef-blue)); }

        .theme-btn {
            background: var(--ef-card);
            border: 1px solid var(--ef-blue);
            color: var(--text-main);
            font-weight: 700;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Symmetric Bracket Layout */
        .tournament-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px;
            min-width: 1200px;
            margin: 0 auto;
        }

        .column { display: flex; flex-direction: column; justify-content: center; gap: 80px; }
        .round-title { 
            font-size: 0.8rem; letter-spacing: 2px; color: var(--ef-blue); 
            text-transform: uppercase; margin-bottom: 10px; text-align: center;
            background: rgba(0, 229, 255, 0.1); padding: 5px;
        }

        /* Match Style */
        .match {
            background: var(--ef-card);
            border: 1px solid var(--ef-border);
            width: 200px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            position: relative;
        }

        .team {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--ef-border);
        }

        .team:hover { background: rgba(0, 229, 255, 0.1); }
        .score { color: var(--ef-blue); }

        /* Final Slot */
        .final-column { gap: 20px; }
        .match.final { border: 2px solid var(--ef-yellow); width: 240px; transform: scale(1.1); }
        .match.final .team { color: var(--ef-yellow); }

        /* Modal / Player Info */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--ef-card);
            border: 2px solid var(--ef-yellow);
            padding: 30px;
            z-index: 2000;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            border-radius: 8px;
        }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1500; }

        @media screen and (max-width: 1200px) {
            body { overflow-x: scroll; }
        }
    </style>
</head>
<body>

<div class="nav-header">
    <img src="https://upload.wikimedia.org/wikipedia/commons/b/b2/EFootball_logo.png" alt="eFootball" class="ef-logo">
    <button id="themeToggle" class="theme-btn">☀️ Day Match</button>
</div>

<header style="text-align: center; margin-bottom: 40px;">
    <h1 style="color: var(--ef-yellow); font-style: italic; letter-spacing: 5px;">ULTIMATE PLAYER S11</h1>
</header>

<div class="tournament-container">
    
    <div class="column">
        <div class="round-title">Left Bracket QF</div>
        <div class="match">
            <div class="team" onclick="checkHistory('Binaya Shrestha')"><span>Binaya Shrestha</span> <span class="score">-</span></div>
            <div class="team" onclick="checkHistory('Manees Paudel')"><span>Manees Paudel</span> <span class="score">-</span></div>
        </div>
        <div class="match">
            <div class="team" onclick="checkHistory('Samir Sunar')"><span>Samir Sunar</span> <span class="score">-</span></div>
            <div class="team" onclick="checkHistory('Siv Sunar')"><span>Siv Sunar</span> <span class="score">-</span></div>
        </div>
    </div>

    <div class="column">
        <div class="round-title">Semi-Final 1</div>
        <div class="match">
            <div class="team"><span>TBD</span> <span class="score">-</span></div>
            <div class="team"><span>TBD</span> <span class="score">-</span></div>
        </div>
    </div>

    <div class="column final-column">
        <div class="round-title" style="color: var(--ef-yellow);">Grand Final</div>
        <div class="match final">
            <div class="team"><span>TBD</span> <span class="score">-</span></div>
            <div class="team"><span>TBD</span> <span class="score">-</span></div>
        </div>
    </div>

    <div class="column">
        <div class="round-title">Semi-Final 2</div>
        <div class="match">
            <div class="team"><span>TBD</span> <span class="score">-</span></div>
            <div class="team"><span>TBD</span> <span class="score">-</span></div>
        </div>
    </div>

    <div class="column">
        <div class="round-title">Right Bracket QF</div>
        <div class="match">
            <div class="team" onclick="checkHistory('Basanta Tamang')"><span>Basanta Tamang</span> <span class="score">-</span></div>
            <div class="team" onclick="checkHistory('Player F')"><span>Player F</span> <span class="score">-</span></div>
        </div>
        <div class="match">
            <div class="team" onclick="checkHistory('Player G')"><span>Player G</span> <span class="score">-</span></div>
            <div class="team" onclick="checkHistory('Player H')"><span>Player H</span> <span class="score">-</span></div>
        </div>
    </div>

</div>

<div id="modalOverlay" class="modal-overlay" onclick="closeModal()"></div>
<div id="playerModal" class="modal">
    <h2 id="modalName" style="color: var(--ef-blue); margin-top: 0;"></h2>
    <p id="modalStatus" style="font-size: 1.2rem;"></p>
    <button class="theme-btn" onclick="closeModal()" style="margin-top: 20px;">Close</button>
</div>

<script>
    // Theme Toggle Logic
    const btn = document.getElementById('themeToggle');
    btn.onclick = () => {
        document.body.classList.toggle('light-mode');
        btn.innerText = document.body.classList.contains('light-mode') ? '🌙 Night Match' : '☀️ Day Match';
    };

    // Player History Logic
    function checkHistory(name) {
        document.getElementById('modalName').innerText = name;
        document.getElementById('modalStatus').innerText = "🏆 Has not won the tournament yet.";
        document.getElementById('playerModal').style.display = 'block';
        document.getElementById('modalOverlay').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('playerModal').style.display = 'none';
        document.getElementById('modalOverlay').style.display = 'none';
    }
</script>

</body>
</html>
