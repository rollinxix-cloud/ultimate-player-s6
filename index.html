<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Player S6 | eFootball Hub</title>
    <style>
        :root {
            --ef-dark: #050a14;
            --ef-gradient: linear-gradient(135deg, #050a14 0%, #1a0b2e 100%);
            --ef-blue: #00e5ff;
            --ef-yellow: #f8ff00;
            --ef-card: rgba(25, 35, 55, 0.95);
            --ef-border: #2a3a5a;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: var(--ef-gradient);
            background-attachment: fixed;
            color: white;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--ef-yellow);
            text-transform: uppercase;
            font-size: 1.5rem;
            font-style: italic;
            margin: 0;
        }

        /* THE FIX: Scrollable area with auto-zoom for mobile */
        .viewport-container {
            width: 100%;
            overflow-x: auto;
            padding: 20px 0;
            display: flex;
            justify-content: center;
        }

        .bracket-scaler {
            transform-origin: top center;
            padding: 20px;
        }

        .bracket {
            display: flex;
            align-items: center;
            gap: 50px;
            width: max-content;
        }

        /* Column and Match Styling */
        .column {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 500px;
            min-width: 200px;
        }

        .round-name {
            color: var(--ef-blue);
            font-size: 0.65rem;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 10px;
            background: rgba(0, 229, 255, 0.1);
            padding: 4px;
        }

        .match {
            background: var(--ef-card);
            border: 1px solid var(--ef-border);
            width: 200px;
            border-radius: 4px;
            position: relative;
        }

        .team {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            border-bottom: 1px solid var(--ef-border);
        }

        .score { color: var(--ef-blue); font-family: monospace; }
        .leg-info {
            font-size: 0.6rem;
            color: #8a9ab0;
            display: block;
            text-align: right;
            padding: 5px 12px;
        }

        /* Connector Lines */
        .match::after {
            content: ""; position: absolute; right: -50px; top: 50%; width: 50px; height: 2px; background: var(--ef-border);
        }
        .column-final .match::after { display: none; }

        .column-qf .match:nth-child(odd)::after {
            height: 65px; border-top: 2px solid var(--ef-border); border-right: 2px solid var(--ef-border); border-radius: 0 10px 0 0; top: 50%;
        }
        .column-qf .match:nth-child(even)::after {
            height: 65px; border-bottom: 2px solid var(--ef-border); border-right: 2px solid var(--ef-border); border-radius: 0 0 10px 0; top: -50%;
        }
        .column-sf .match:nth-child(odd)::after {
            height: 125px; border-top: 2px solid var(--ef-border); border-right: 2px solid var(--ef-border); border-radius: 0 10px 0 0; top: 50%;
        }
        .column-sf .match:nth-child(even)::after {
            height: 125px; border-bottom: 2px solid var(--ef-border); border-right: 2px solid var(--ef-border); border-radius: 0 0 10px 0; top: -50%;
        }

        /* MOBILE SPECIFIC MEDIA QUERY */
        @media screen and (max-width: 768px) {
            .bracket-scaler {
                transform: scale(0.7); /* Zooms out the bracket so it fits better */
            }
            .viewport-container {
                justify-content: flex-start; /* Allows scrolling from the left */
            }
        }
    </style>
</head>
<body>

<header>
    <h1>ULTIMATE PLAYER S6</h1>
</header>

<div class="viewport-container">
    <div class="bracket-scaler">
        <div class="bracket">
            <div class="column column-qf">
                <div class="round-name">Quarter-Finals</div>
                <div class="match"><div class="team"><span>Player A</span> <span class="score">-</span></div><div class="team"><span>Player B</span> <span class="score">-</span></div><span class="leg-info">Waiting...</span></div>
                <div class="match"><div class="team"><span>Player C</span> <span class="score">-</span></div><div class="team"><span>Player D</span> <span class="score">-</span></div><span class="leg-info">Waiting...</span></div>
                <div class="match"><div class="team"><span>Player E</span> <span class="score">-</span></div><div class="team"><span>Player F</span> <span class="score">-</span></div><span class="leg-info">Waiting...</span></div>
                <div class="match"><div class="team"><span>Player G</span> <span class="score">-</span></div><div class="team"><span>Player H</span> <span class="score">-</span></div><span class="leg-info">Waiting...</span></div>
            </div>

            <div class="column column-sf">
                <div class="round-name">Semi-Finals</div>
                <div class="match"><div class="team"><span>TBD</span> <span class="score">-</span></div><div class="team"><span>TBD</span> <span class="score">-</span></div><span class="leg-info">QF Pending</span></div>
                <div class="match"><div class="team"><span>TBD</span> <span class="score">-</span></div><div class="team"><span>TBD</span> <span class="score">-</span></div><span class="leg-info">QF Pending</span></div>
            </div>

            <div class="column column-final">
                <div class="round-name">Grand Final</div>
                <div class="match" style="border-color: var(--ef-yellow);">
                    <div class="team" style="color: var(--ef-yellow);"><span>TBD</span> <span class="score">-</span></div>
                    <div class="team"><span>TBD</span> <span class="score">-</span></div>
                    <span class="leg-info">Final Match</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
